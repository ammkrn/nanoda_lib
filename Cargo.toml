
[package]
name = "nanoda_lib"
version = "0.4.19"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/ammkrn/nanoda_lib"
description = "A type checker for the Lean 4 programming language and theorem prover"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[profile.release]
opt-level=3
overflow-checks=true
lto=true

[profile.test]
opt-level=3
overflow-checks=true

[dev-dependencies]
rand = "0.10.2"
num-bigint = { version = "0.5.1", features = ["rand_0_10", "serde"] }

[dependencies]
indexmap = "2.13.0"
rustc-hash = "1.1.0"
num-bigint = { version = "0.5.1", features = ["serde"] }
num-integer = "0.1.47"
num-traits = "0.2.19"
semver = "1.0.27"
serde_json = "1.0.111"
serde = { version = "1.0.228", features = ["derive"] }

[[bin]]
name = "nanoda_bin"
path = "src/main.rs"
bench = false